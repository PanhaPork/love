<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Anniversary ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    min-height: 100vh;
    text-align: center;
    overflow-x: hidden;
}

.container {
    background: white;
    padding: 40px 30px;
    border-radius: 25px;
    max-width: 600px;
    width: 90%;
    margin: 50px auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.photo {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #e63950;
    margin-bottom: 20px;
}

h1 {
    color: #e63950;
    font-size: 40px;
}

.heart {
    font-size: 60px;
    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

p {
    color: #666;
    font-size: 18px;
    line-height: 1.7;
    margin-top: 15px;
}

button {
    margin-top: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    background: #e63950;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.1);
}

/* Gallery */
.gallery {
    display: none;
    padding: 30px;
}

.gallery h2 {
    color: white;
    font-size: 35px;
    margin-bottom: 25px;
}

.photos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.photos img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    border: 5px solid white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.photos img:hover {
    transform: scale(1.1);
}

/* Falling Hearts */
.falling-heart {
    position: fixed;
    top: -50px;
    font-size: 35px;
    animation: fall linear forwards;
    z-index: 999;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}
</style>

</head>

<body>

<div class="container">

    <!-- Main Photo -->
    <img src="/Html/images/gf.jpg" class="photo" alt="Our Photo">

    <div class="heart">❤️</div>

    <h1>Happy Anniversary!</h1>

    <h2>My Love ❤️</h2>

    <p>
        Thank you for being part of my life.
        Every moment with you is special.
        I Love You So Much! ❤️
    </p>

    <button onclick="showLove()">Click Me ❤️</button>

</div>


<!-- Hidden Photo Gallery -->

<div class="gallery" id="gallery">

    <h2>Our Beautiful Memories ❤️</h2>

    <div class="photos">

        <img src="/Html/images/photo_1_2026-09-07_15-03-09.jpg">
        <img src="/Html/images/photo_2_2026-09-07_15-03-09.jpg">
        <img src="/Html/images/photo_3_2026-09-07_15-03-09.jpg">
        <img src="/Html/images/photo_4_2026-09-07_15-03-09.jpg">
        <img src="/Html/images/photo_5_2026-09-07_15-03-09.jpg">
        <img src="/Html/images/photo_2026-09-07_15-06-58.jpg">

    </div>

</div>


<script>

function showLove() {

    // Show photos
    document.getElementById("gallery").style.display = "block";

    // Create many hearts
    for (let i = 0; i < 50; i++) {

        let heart = document.createElement("div");

        heart.classList.add("falling-heart");

        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.animationDuration =
            Math.random() * 3 + 3 + "s";

        heart.style.fontSize =
            Math.random() * 30 + 20 + "px";

        document.body.appendChild(heart);

        // Remove heart after animation
        setTimeout(() => {
            heart.remove();
        }, 6000);

    }

}

</script>

</body>
</html>
